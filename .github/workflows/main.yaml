name: CI

on:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'setup.cfg'
      - '.github/workflows/*.yaml'

jobs:
 build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv sync --all-extras --dev
          # abort if the lockfile changes
          [[ -n $(git diff --stat uv.lock) ]] && exit 1
      - run: uv run poe all
        env:
          POSTGRES_PASSWORD: for-testing
          SLB_API_TOKEN_DISCORD: for-testing
          SLB_API_TOKEN_BOT_LIST_DBL: for-testing
          SLB_API_TOKEN_BOT_LIST_BOD: for-testing
          SLB_API_TOKEN_BOT_LIST_DBG: for-testing
          SLB_API_TOKEN_BOT_LIST_BFD: for-testing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: psidex/spacexlaunchbot:${{ github.ref_name }}
